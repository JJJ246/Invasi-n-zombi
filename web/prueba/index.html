<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; object-src 'none'; base-uri 'self'">
  <title>Prueba: barrio pintado</title>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0a0610; --text: #f3ead8; --orange: #ff8a1f; --green: #9cf06b; --line: #ffffff22; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Inter, sans-serif; overflow: hidden; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
    .bar { position: fixed; top: 14px; left: 14px; right: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; border: 1px solid var(--line); border-radius: 14px; background: #0a0610cc; backdrop-filter: blur(6px); }
    .bar h1 { margin: 0 12px 0 0; font: 400 1.6rem Creepster, cursive; color: var(--orange); letter-spacing: 0.04em; }
    button { font: 600 0.85rem Inter; color: var(--text); background: #ffffff10; border: 1px solid var(--line); border-radius: 999px; padding: 0.45rem 0.9rem; cursor: pointer; }
    button.on { background: var(--orange); color: #1a0d00; border-color: var(--orange); }
    button:hover { border-color: var(--orange); }
    .group { display: flex; gap: 6px; padding-right: 8px; border-right: 1px solid var(--line); }
    .counts { margin-left: auto; display: flex; gap: 14px; font-size: 0.85rem; }
    .counts b { font-variant-numeric: tabular-nums; }
    .note { position: fixed; left: 14px; bottom: 14px; max-width: 520px; margin: 0; padding: 8px 12px; border-radius: 10px; background: #0a0610cc; font-size: 0.8rem; color: #cbbfd8; }
    video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; z-index: 10; transition: opacity 0.6s; }
    video.out { opacity: 0; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="bar">
    <h1>Barrio de prueba</h1>
    <span class="group" id="mapas"></span>
    <button type="button" data-mode="zombi" class="on">Plaga zombi</button>
    <button type="button" data-mode="dengue">Dengue</button>
    <button type="button" id="brote">Empezar brote</button>
    <button type="button" id="plan">Plan del Comité: vacunar el entorno</button>
    <button type="button" id="corte">Ver el corte</button>
    <button type="button" id="calles">Ver calles</button>
    <div class="counts"><span>Sanos <b id="nS">0</b></span><span>Enfermos <b id="nI">0</b></span><span>Vacunados <b id="nV">0</b></span></div>
  </div>
  <p class="note">Prueba visual con arte de Higgsfield: el barrio, las personas y el video son generados; el movimiento, el contagio y la neblina que sube y se despeja son nuestros. Todavía no está conectado al motor del simulador.</p>
  <video id="cut" playsinline hidden></video>
  <script type="module" src="prueba.js"></script>
</body>
</html>
